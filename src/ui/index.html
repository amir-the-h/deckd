<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deckd</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo"></span>deckd</div>
  <select id="device" title="Device"></select>
  <div class="spacer"></div>
  <span id="status" class="status">connecting…</span>
</header>

<main class="layout">
  <aside class="pages panel">
    <div class="panel-head">
      <h2>Pages</h2>
      <button id="page-add" class="icon-btn" title="New page">+</button>
    </div>
    <ul id="page-list" class="page-list"></ul>
    <div class="profile">
      <label>Brightness <span id="brightness-value"></span>
        <input id="brightness" type="range" min="0" max="100">
      </label>
    </div>
  </aside>

  <section class="stage">
    <div class="stage-head">
      <h1 id="page-title">—</h1>
      <div class="page-actions">
        <span id="on-deck" class="badge">On deck</span>
        <button id="show-on-deck" class="btn">Show on deck</button>
        <button id="page-default" class="btn">Make default</button>
        <button id="page-rename" class="btn">Rename</button>
        <button id="page-delete" class="btn danger">Delete</button>
      </div>
    </div>
    <div id="deck" class="deck"></div>
    <p class="hint">Drag an action onto a key or dial. Drag between slots to move them. Click a slot to edit it.</p>
  </section>

  <aside class="side panel">
    <div class="tabs">
      <button class="tab active" data-tab="library">Actions</button>
      <button class="tab" data-tab="inspector">Inspector</button>
      <button class="tab" data-tab="plugins">Plugins</button>
    </div>
    <div id="tab-library" class="tab-body">
      <input id="search" class="search" type="search" placeholder="Search actions">
      <div id="library"></div>
    </div>
    <div id="tab-inspector" class="tab-body hidden">
      <div id="inspector" class="inspector"><p class="empty">Select a key or dial.</p></div>
    </div>
    <div id="tab-plugins" class="tab-body hidden">
      <div class="section">
        <div class="row">
          <button id="plugin-install" class="btn primary">Install plugin or icon pack…</button>
        </div>
        <p class="muted">Accepts .streamDeckPlugin and .streamDeckIconPack files, e.g. downloaded from the Elgato Marketplace.</p>
        <input id="plugin-file" type="file" accept=".streamDeckPlugin,.streamDeckIconPack,.zip" class="hidden">
      </div>
      <div id="plugin-list" class="stack"></div>
    </div>
  </aside>
</main>

<div id="modal" class="modal hidden">
  <form id="modal-form" class="modal-card">
    <h3 id="modal-title"></h3>
    <input id="modal-input" autocomplete="off">
    <div class="modal-actions">
      <button type="button" id="modal-cancel" class="btn">Cancel</button>
      <button type="submit" class="btn primary">OK</button>
    </div>
  </form>
</div>
<div id="picker" class="modal hidden">
  <div class="picker-card">
    <div class="picker-head">
      <h3>Choose an icon</h3>
      <input id="picker-search" type="search" placeholder="Search icons, e.g. volume, mic, discord">
      <label class="row picker-opt" title="Icon colour">Colour <input id="picker-color" type="color" value="#ffffff"></label>
      <label class="row picker-opt" title="How much of the key the icon fills">Size <input id="picker-scale" type="range" min="30" max="100" value="60"></label>
      <button id="picker-close" class="btn">Close</button>
    </div>
    <div class="picker-body">
      <nav id="picker-sources" class="picker-sources"></nav>
      <div id="picker-results" class="picker-results"></div>
    </div>
    <div class="picker-foot">
      <span class="muted" id="picker-note"></span>
      <button id="picker-restyle" class="btn small" title="Give every library icon on this page the colour and size above">Apply colour &amp; size to all library icons on this page</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="/ui/app.js"></script>
</body>
</html>
